name: sistema-mercado

services:
  # ---------- Capa de datos: SQL Server ----------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mercado-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mercado_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Capa de negocio: API en Django ----------
  backend:
    build: ./backend
    container_name: mercado-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # el código se actualiza sin reconstruir la imagen
    depends_on:
      db:
        condition: service_healthy

  # ---------- Tareas automáticas: cierre del día a las 00:00 ----------
  tareas:
    build: ./backend
    container_name: mercado-tareas
    env_file: .env
    command: ["sh", "-c", "python esperar_db.py && python manage.py planificador"]
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  # ---------- Capa de presentación: React ----------
  frontend:
    build: ./frontend
    container_name: mercado-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # node_modules queda dentro del contenedor
    depends_on:
      - backend

volumes:
  mercado_db_data:
